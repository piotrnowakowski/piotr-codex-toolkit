<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Motion Video</title>

<style>
:root{--ink:#172035;--paper:#FAF8F5;--gold:#E8C98A}
html,body{margin:0;background:var(--ink)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--ink);color:var(--paper);font-family:Arial,sans-serif}
#stage *{box-sizing:border-box}
[data-shot],#gl{position:absolute;inset:0}
[data-shot]{visibility:hidden}
#gl{pointer-events:none;z-index:2}
.label{position:absolute;left:150px;top:235px;font:600 24px/1.3 Arial;letter-spacing:.13em;text-transform:uppercase;color:var(--gold)}

#craft .label{top:145px}

</style></head><body>
<div id="stage">
 <section id="hook" data-shot data-start="0" data-duration="2.5"><div class="label" data-check-bounds>Motion Video</div><h1 data-check-bounds>Make it<br>move.</h1><div class="note" data-check-bounds>One idea. Made visible.</div></section>
 <section id="craft" data-shot data-start="2.5" data-duration="3"><div class="label" data-check-bounds>From a brief to a film</div><h1 data-check-bounds>Sketch.<br>Animate.<br>Render.</h1><div class="steps" data-check-bounds><span>Every frame, intentional.</span></div></section>
 <section id="end" data-shot data-start="5.5" data-duration="2.5"><div class="label" data-check-bounds>Your next film</div><h1 data-check-bounds>Motion<br>Video.</h1><div class="note" data-check-bounds>Built in code. Ready to share.</div></section>
 <canvas id="gl"></canvas>
</div>
<script type="module">
import * as THREE from 'three';
const VIDEO = window.VIDEO = {width:1920,height:1080,fps:30,duration:8,audio:true};

  const u=t-(+el.dataset.start),on=u>=0&&u<(+el.dataset.duration);el.style.visibility=on?'visible':'hidden';

};

</script></body></html>
